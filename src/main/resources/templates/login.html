<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2 th:text="#{login}">Login</h2>

      <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Invalid username or password
      </div>

      <form th:action="@{/login}" method="post" class="form-horizontal">
        <div class="form-group">
          <label for="username" class="col-sm-2 control-label">Username</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="col-sm-2 control-label">Password</label>
          <div class="col-sm-10">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required />
          </div>
        </div>

        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary">Sign in</button>
          </div>
        </div>
      </form>

      <h3>Demo Users</h3>
      <p>You can use the following credentials to test the application:</p>
      <ul>
        <li><strong>Admin:</strong> username: admin, password: admin</li>
        <li><strong>Vet:</strong> username: vet, password: vet</li>
        <li><strong>Front Desk:</strong> username: frontdesk, password: frontdesk</li>
      </ul>
    </div>
  </div>

</body>

</html>
